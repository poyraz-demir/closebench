[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closebench"
version = "0.1.1"
description = "Deterministic, seeded double-entry ledgers with planted closing errors and a programmatic grader — test fixtures for bookkeeping agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "accounting", "bookkeeping", "ledger", "double-entry", "month-end close",
  "test-fixtures", "benchmark", "agent-evaluation", "llm-agents", "fintech",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/poyraz-demir/closebench"
Repository = "https://github.com/poyraz-demir/closebench"
Issues = "https://github.com/poyraz-demir/closebench/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
closebench = "closebench.cli:main"

[tool.setuptools]
packages = ["closebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
